[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "heyblog-webscraper"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7,<3",
  "defusedxml>=0.7,<1",
]

[dependency-groups]
dev = ["pytest>=8.3,<9"]

[tool.setuptools]
packages = [
  "heyblog_webscraper",
  "heyblog_webscraper.collector",
  "heyblog_webscraper.net",
]
package-dir = { heyblog_webscraper = "src" }

[tool.pytest.ini_options]
testpaths = ["tests"]
